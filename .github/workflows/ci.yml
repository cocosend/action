name: DJ TrackBuilder MixAuto Pro CI
on:
  push:
    branches: [main, mixauto-ios-ci]
  pull_request:
permissions:
  contents: read
jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ core
        run: cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ core and tests
        run: cmake --build .build --parallel 2
      - name: Test DSP and controls
        run: ctest --test-dir .build --output-on-failure
      - name: Verify native DSP, Swift models and WAV (Linux source-only)
        run: scripts/verify_linux.sh
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: xcodegen generate --spec project.yml
      - name: Verify Swift project schema
        run: |
          swiftc ios/App/TempoAnalyzer.swift ios/App/BeatGridAnalyzer.swift ios/App/BeatGridEditor.swift ios/App/TrackProject.swift ios/App/FileLoopPlan.swift ios/App/ImportedAudioStore.swift tests/TrackProjectTests.swift -o /tmp/track_project_tests
          /tmp/track_project_tests
          swiftc ios/App/TempoAnalyzer.swift ios/App/BeatGridAnalyzer.swift ios/App/FileLoopPlan.swift ios/App/ImportedAudioStore.swift ios/App/FileDeckPerformance.swift tests/FileDeckPerformanceTests.swift -o /tmp/cue_tests
          /tmp/cue_tests
          swiftc ios/App/TempoAnalyzer.swift ios/App/BeatGridAnalyzer.swift ios/App/FileLoopPlan.swift ios/App/ImportedAudioStore.swift ios/App/BeatGridEditor.swift ios/App/FileDeckPerformance.swift ios/App/AnalysisMergePolicy.swift tests/AnalysisMergePolicyTests.swift -o /tmp/analysis_merge_tests
          /tmp/analysis_merge_tests
          swiftc ios/App/TimedBlendPlan.swift tests/TimedBlendPlanTests.swift -o /tmp/blend_tests
          /tmp/blend_tests
          swiftc ios/App/TempoAnalyzer.swift ios/App/BeatGridAnalyzer.swift ios/App/BeatHintTransition.swift tests/BeatHintTransitionTests.swift -o /tmp/beat_hint_tests
          /tmp/beat_hint_tests
          swiftc ios/App/TempoAnalyzer.swift ios/App/BeatGridAnalyzer.swift ios/App/FileLoopPlan.swift tests/FileLoopPlanTests.swift -o /tmp/loop_tests
          /tmp/loop_tests
          swiftc ios/App/TempoAnalyzer.swift ios/App/TempoCompatibility.swift tests/TempoCompatibilityTests.swift -o /tmp/compat_tests
          /tmp/compat_tests
      - name: Verify route-change safety and cancellable background workers
        run: |
          swiftc ios/App/AudioRoutePolicy.swift tests/AudioRoutePolicyTests.swift -o /tmp/route_policy_tests
          /tmp/route_policy_tests
          swiftc ios/App/BackgroundWork.swift tests/BackgroundWorkTests.swift -o /tmp/background_work_tests
          /tmp/background_work_tests
          swiftc ios/App/ImportCommitPolicy.swift tests/ImportCommitPolicyTests.swift -o /tmp/import_commit_tests
          /tmp/import_commit_tests
      - name: Build for iPhone simulator without signing
        run: >-
          xcodebuild -project DJTrackBuilderMixAutoPro.xcodeproj
          -scheme DJTrackBuilderMixAutoPro
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Select and boot an actual iOS Simulator device
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulator-devices.json"
          SIM_ID=$(python3 - "$RUNNER_TEMP/simulator-devices.json" <<'PY_SELECT'
          import json, sys
          devices=json.load(open(sys.argv[1]))['devices']
          for runtime, models in devices.items():
              for device in models:
                  if device.get('isAvailable', True) and 'iPhone' in device['name']:
                      print(device['udid']); sys.exit(0)
          sys.exit('No iPhone simulator available on selected macOS runner')
          PY_SELECT
          )
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
      - name: Run native XCUITest UI smoke tests and preserve screenshots
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DJTrackBuilderMixAutoPro.xcodeproj \
            -scheme DJTrackBuilderMixAutoPro \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/MixAutoDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MixAutoUITests.xcresult" \
            -parallel-testing-enabled NO \
            -configuration Debug CODE_SIGNING_ALLOWED=NO test
      - name: Capture native simulator cockpit screenshot and app archive
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/MixAutoArtifacts"
          if test -d "$RUNNER_TEMP/MixAutoDerivedData/Build/Products/Debug-iphonesimulator/DJTrackBuilderMixAutoPro.app"; then
            APP="$RUNNER_TEMP/MixAutoDerivedData/Build/Products/Debug-iphonesimulator/DJTrackBuilderMixAutoPro.app"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/MixAutoArtifacts/MixAuto-iOS-Simulator-Unsigned.zip"
            xcrun simctl install "${{ steps.sim.outputs.id }}" "$APP" || true
            xcrun simctl launch "${{ steps.sim.outputs.id }}" com.artss.trackbuilder.mixautopro || true
            sleep 3
            xcrun simctl io "${{ steps.sim.outputs.id }}" screenshot "$RUNNER_TEMP/MixAutoArtifacts/First-Canva-Cockpit-Simulator.png" || true
          fi
          if test -d "$RUNNER_TEMP/MixAutoUITests.xcresult"; then
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/MixAutoUITests.xcresult" "$RUNNER_TEMP/MixAutoArtifacts/MixAutoUITests-xcresult.zip"
          fi
      - name: Upload simulator app, cockpit screenshot and XCTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixauto-ios-simulator-evidence
          path: ${{ runner.temp }}/MixAutoArtifacts/
          if-no-files-found: warn
          retention-days: 14
